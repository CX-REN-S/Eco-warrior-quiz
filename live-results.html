<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Results — Eco-Warrior Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-ark-logo">
    <img src="assets/ARK_white_transparent_header.png" alt="ARK Initiative" class="ark-logo">
  </a>
  <div class="nav-links">
    <a href="index.html">Profile Test</a>
    <a href="archetypes.html">Archetypes</a>
    <a href="live-results.html" class="active">Live Results</a>
  </div>
  <div class="nav-contact-wrap">
    <button class="nav-contact-btn" id="contact-btn" aria-haspopup="true" aria-expanded="false">Contact Us ▾</button>
    <div class="nav-contact-dropdown" id="contact-dropdown" role="menu">
      <div class="nav-contact-item">
        <img src="assets/LinkedIn_icon.svg.png" alt="" class="nav-contact-icon">
        <div class="nav-contact-text">
          <span class="nav-contact-platform">LinkedIn</span>
          <a class="nav-contact-account" href="https://www.linkedin.com/company/a-r-k-initiative" target="_blank" rel="noopener">A.R.K Initiative</a>
        </div>
      </div>
      <div class="nav-contact-item">
        <img src="assets/Instagram_icon.png" alt="" class="nav-contact-icon">
        <div class="nav-contact-text">
          <span class="nav-contact-platform">Instagram</span>
          <a class="nav-contact-account" href="https://www.instagram.com/arkinitiative.sg?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">@arkinitiative.sg</a>
        </div>
      </div>
      <div class="nav-contact-item">
        <img src="assets/Gmail_icon_(2020).png" alt="" class="nav-contact-icon">
        <div class="nav-contact-text">
          <span class="nav-contact-platform">Email</span>
          <span class="nav-contact-account">arkinitiative.bagus.sg@gmail.com</span>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="live-page">

  <header class="live-page-header">
    <h1>Live Pledge Results</h1>
    <p>See what pledges eco-warriors are making across all quiz responses.</p>
  </header>

  <div id="live-notice" class="live-notice hidden"></div>

  <div class="live-cloud-card">
    <div id="live-cloud"></div>
  </div>

  <div class="live-status">
    <div class="live-status-left">
      <span id="live-source" class="live-source"></span>
      <span id="live-total" class="live-total"></span>
    </div>
    <div class="live-status-right">
      <span id="live-updated" class="live-updated"></span>
      <button class="btn btn-secondary btn-sm" id="btn-refresh">Refresh</button>
    </div>
  </div>

  <div id="live-breakdown" class="live-breakdown"></div>

</div>

<script src="live-results.js"></script>
<script>
  const contactBtn = document.getElementById('contact-btn');
  const contactDropdown = document.getElementById('contact-dropdown');
  contactBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = contactDropdown.classList.contains('open');
    contactDropdown.classList.toggle('open', !open);
    contactBtn.setAttribute('aria-expanded', String(!open));
  });
  document.addEventListener('click', e => {
    if (!contactBtn.contains(e.target) && !contactDropdown.contains(e.target)) {
      contactDropdown.classList.remove('open');
      contactBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>
</body>
</html>
