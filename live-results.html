<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Results — Eco-Warrior Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="site-nav">
  <a href="index.html">Personality Test</a>
  <a href="archetypes.html">Archetypes</a>
  <a href="live-results.html" class="active">Live Results</a>
</nav>

<div class="live-page">

  <header class="live-page-header">
    <h1>Live Archetype Results</h1>
    <p>See which eco-warrior archetypes are appearing across all quiz responses.</p>
  </header>

  <div id="live-notice" class="live-notice hidden"></div>

  <div class="live-cloud-card">
    <div id="live-cloud"></div>

  <div class="live-status">
    <div class="live-status-left">
      <span id="live-source" class="live-source"></span>
      <span id="live-total" class="live-total"></span>
    </div>
    <div class="live-status-right">
      <span id="live-updated" class="live-updated"></span>
      <button class="btn btn-secondary btn-sm" id="btn-refresh">Refresh</button>
    </div>
  </div>

  <div id="live-breakdown" class="live-breakdown"></div>

</div>

<script src="live-results.js"></script>
